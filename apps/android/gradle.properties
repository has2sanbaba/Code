org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 enables built-in Kotlin (compiler 2.2.0), but quickjs-kt 1.0.15 ships
# Kotlin 2.4.10 metadata -- the built-in compiler cannot read its own stdlib.
# Opt out exactly like quickjs-kt's own build does and apply KGP 2.4.10.
android.builtInKotlin=false
android.newDsl=false
