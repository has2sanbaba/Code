name: Android

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  engine-and-apk:
    name: TS core -> engine bundle -> QuickJS unit tests -> APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- the symbology core (TypeScript) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Build core + CLI
        run: npm run build

      - name: Run the reference test suites (161 tests)
        run: npm test

      # ---------- the engine bundle the phone runs ----------
      - name: Regenerate engine bundle and Android vectors
        run: |
          node tools/build-engine.mjs
          node tools/gen-android-vectors.mjs

      - name: Committed engine.js and vectors must be fresh
        run: git diff --exit-code -- apps/android/app/src/main/assets/engine.js apps/android/app/src/test/resources

      - name: Engine protocol gate (Node, bare globalThis like QuickJS)
        run: node tools/check-engine-bundle.mjs

      # ---------- the native app ----------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Unit tests (engine in a real QuickJS runtime) + assembleDebug
        working-directory: apps/android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gradle.log

      # The authoring sandbox cannot fetch Actions log files, so a failing run
      # posts the relevant Gradle output into the pull request instead.
      - name: Report failure into the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Android CI failed (run ${{ github.run_id }})"
            echo
            echo '```'
            if [ -f /tmp/gradle.log ]; then
              echo '----- failed test events -----'
              grep -E ' (FAILED|PASSED|SKIPPED)$|AssertionError|QuickJsException|UnsatisfiedLink|Exception:' /tmp/gradle.log | head -60 || true
              for f in apps/android/app/build/test-results/testDebugUnitTest/TEST-*.xml; do
                [ -e "$f" ] || continue
                echo "----- $f -----"
                grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
                awk '/<testcase/{name=$0} /<failure/{print name; infail=1} infail{print} /<\/failure>/{infail=0}' "$f" | head -120
              done
              start=$(grep -n -m1 'What went wrong' /tmp/gradle.log | cut -d: -f1 || true)
              if [ -n "$start" ]; then sed -n "${start},$((start + 40))p" /tmp/gradle.log; fi
              echo '----- tail -----'
              tail -n 30 /tmp/gradle.log
            else
              echo "Gradle log not found; the failure happened in an earlier step."
            fi
            echo '```'
          } > /tmp/report.md
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --head-ref "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          fi
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/report.md
          else
            cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simurgh-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # One universal APK must carry the QuickJS native library for every phone
      # CPU; fail loudly if a build ever drops an ABI.
      - name: Verify all four ABIs are inside the APK
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          found=$(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ABIs in APK: $found"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$APK" "lib/$abi/libquickjs*.so" >/dev/null 2>&1 || {
              echo "MISSING ABI: $abi"; exit 1; }
          done
          echo "All four ABIs present (32/64-bit ARM + 32/64-bit x86)."
          {
            echo "APK_ABIS=$found"
            echo "APK_BYTES=$(stat -c%s "$APK")"
          } >> "$GITHUB_ENV"

      # Every build on main lands in GitHub Releases: a versioned tag plus a
      # rolling "latest" release, so the APK is downloadable without signing in
      # to Actions. Runs on main only (pull requests cannot write releases).
      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' apps/android/app/build.gradle.kts | head -1)
          cp "$APK" "SiMurgh-Code-${VERSION}.apk"
          cp "$APK" "SiMurgh-Code-latest.apk"
          cat > notes.md <<EOF
          SiMurgh Code ${VERSION} — native Android (Kotlin + CameraX, QuickJS engine).

          Built from commit ${GITHUB_SHA::7} by GitHub Actions. One universal debug-signed
          APK: installs on Android 6.0 (API 23) through the newest release, on every phone
          CPU: ${APK_ABIS}. No INTERNET permission — offline by construction.

          Install: download the APK below, allow "install unknown apps", then open it.
          Size: ${APK_BYTES} bytes.
          EOF
          gh release create "v${VERSION}-android" "SiMurgh-Code-${VERSION}.apk" \
            --title "SiMurgh Code ${VERSION} — Android" --notes-file notes.md --latest 2>/dev/null || \
            gh release upload "v${VERSION}-android" "SiMurgh-Code-${VERSION}.apk" --clobber
          gh release create "latest" "SiMurgh-Code-latest.apk" \
            --title "SiMurgh Code — latest Android build" --notes-file notes.md 2>/dev/null || \
            gh release upload "latest" "SiMurgh-Code-latest.apk" --clobber
          echo "published v${VERSION}-android and latest"
